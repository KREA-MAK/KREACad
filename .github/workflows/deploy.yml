name: Deploy to SiteGround (FTP)

# Builds the static site and deploys dist/ to SiteGround over FTP.
# Runs on every push to master (and can be run manually via workflow_dispatch).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SITEGROUND_FTP_HOST      FTP server host (e.g. the SiteGround FTP hostname/IP)
#   SITEGROUND_FTP_USER      FTP username
#   SITEGROUND_FTP_PASSWORD  FTP password
#   SITEGROUND_FTP_PORT      FTP port (SiteGround: 21)
#   SITEGROUND_REMOTE_DIR    remote web-root directory (e.g. public_html/); a trailing
#                            slash is added automatically if missing

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: |
          npm run build_engine
          npm run create_dist

      - name: Normalize remote directory (ensure trailing slash)
        id: prep
        run: |
          dir="${{ secrets.SITEGROUND_REMOTE_DIR }}"
          case "$dir" in
            "")  dir="./" ;;
            */)  ;;
            *)   dir="$dir/" ;;
          esac
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy dist/ to SiteGround via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SITEGROUND_FTP_HOST }}
          username: ${{ secrets.SITEGROUND_FTP_USER }}
          password: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          port: ${{ secrets.SITEGROUND_FTP_PORT }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.prep.outputs.server_dir }}
